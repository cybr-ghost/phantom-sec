name: Build Linux AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: Build x86_64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build standalone desktop executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name phantom-sec \\
            --collect-all rich --collect-all dns \\
            packaging/appimage_entry.py

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          install -m 755 dist/phantom-sec AppDir/usr/bin/phantom-sec
          install -m 644 packaging/phantom-sec.desktop AppDir/usr/share/applications/phantom-sec.desktop
          install -m 644 packaging/phantom-sec.svg AppDir/usr/share/icons/hicolor/scalable/apps/phantom-sec.svg
          cp packaging/phantom-sec.svg AppDir/phantom-sec.svg
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/bin:$PATH"
          exec "$HERE/usr/bin/phantom-sec" "$@"
          EOF
          chmod 755 AppDir/AppRun
          ln -sf usr/share/applications/phantom-sec.desktop AppDir/phantom-sec.desktop
          ln -sf usr/share/icons/hicolor/scalable/apps/phantom-sec.svg AppDir/.DirIcon

      - name: Download appimagetool
        run: |
          curl -L --fail --retry 3 \\
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \\
            -o appimagetool
          chmod +x appimagetool

      - name: Create AppImage
        run: ARCH=x86_64 ./appimagetool AppDir Phantom-Sec-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-Sec-x86_64-AppImage
          path: Phantom-Sec-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Phantom-Sec-x86_64.AppImage
