name: CodeQL security analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze Python code
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      # Code scanning is not enabled for this private repository yet.
      # Run analysis locally in the workflow without attempting a SARIF upload.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
