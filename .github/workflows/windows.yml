name: Build Windows packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64 installer and portable ZIP
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build standalone desktop application
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Phantom-Sec --collect-all rich --collect-all dns packaging/appimage_entry.py

      - name: Create portable ZIP
        run: Compress-Archive -Path dist/Phantom-Sec.exe -DestinationPath Phantom-Sec-Windows-x64.zip
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Build Windows installer
        run: '& "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" packaging/windows-installer.iss'
        shell: pwsh

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-Sec-Windows-x64
          path: |
            Phantom-Sec-Setup-x64.exe
            Phantom-Sec-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Phantom-Sec-Setup-x64.exe
            Phantom-Sec-Windows-x64.zip
